services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A project worker -l INFO
    env_file:
      - .env
    depends_on: 
      - redis  
  
  celery-beat:
    build: .
    command: celery -A project beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on: 
      - redis